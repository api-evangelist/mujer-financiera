name: Mujer Financiera
description: >-
  Mujer Financiera is a Latin American financial-education platform founded in 2018 in Buenos Aires,
  Argentina by Sabrina Castelli, focused on closing the gender gap in financial inclusion. It delivers
  courses, packs, and multi-month programs (MF Platinum) on budgeting, saving, and investing, alongside a
  mobile app for tracking personal finances, a supportive community, a newsletter, and corporate
  financial-education services for companies. The platform reports hundreds of thousands of women served
  across 12+ countries and is backed by 500 Global. It is a business-to-consumer fintech/edtech offering
  and publishes no public API, developer portal, or SDKs; this profile captures its public identity and
  domain-security posture.
